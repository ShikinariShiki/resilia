name: 'Build Tauri App'

on:
  # Only build desktop releases on explicit version tags or manual trigger.
  # This avoids the workflow failing on every push to main (web app deploys via Vercel).
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642195f882787471b1b7cca # v4.4.0
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc97272 # stable

      - name: install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm ci || npm install

      - uses: tauri-apps/tauri-action@45ab08a3d16b7ceb3393c8a6c72de4c0dce76ce4 # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
